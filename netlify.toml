[build]
  functions = "netlify/functions"
  publish = "."
  # Build SCSS and install Function dependencies via pnpm
  command = "corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm run build && cd netlify/functions && pnpm install --frozen-lockfile && cd ../.."

[functions]
  # esbuild bundelt nodemailer MIT in die Function
  node_bundler = "esbuild"

# SPA Redirects - route all paths to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
